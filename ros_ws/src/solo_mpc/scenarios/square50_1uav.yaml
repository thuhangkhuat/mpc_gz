# 50 x 50 m map centred on the world origin, one UAV starting at (0, 0), fixed target.
# A yellow ground strip marks the map bounds (visual only, no wall).
# Obstacles are small: poles (0.15 m radius), masts (0.3 m), narrow frames and
# 1 m boxes, extruded to the controller's obstacle_height. Layout generated once
# with a fixed seed: at least 2.5 m between obstacles, 5 m clear of start and
# target, 2 m inside the bounds.
# Run: ./scripts/dev mpc --fleet /workspace/config/fleet_1uav.yaml \
#        --scenario /workspace/ros_ws/src/solo_mpc/scenarios/square50_1uav.yaml \
#        --settings /workspace/ros_ws/src/solo_mpc/config/controller_solo.yaml
description: single UAV from the origin to a fixed target on a 50 x 50 m map of small obstacles
world_name: mpc_square50
xlim: [-25, 25]
ylim: [-25, 25]
viewing_radius: 1.5
tar_max_speed: 0.6      # controller's assumed target speed bound; the target does not move

starts:                 # [x, y, z], metres
  - [0, 0, 3]

target:
  waypoints:            # a single waypoint keeps the target fixed
    - [18, 18]

obstacles:
  rects:                # [left, bottom, width, height]
    - [-19.5, 3.5, 0.4, 1.6]
    - [-8.6, -11.1, 1.0, 1.0]
    - [5.2, 0.2, 1.0, 1.0]
  circles:              # [center_x, center_y, radius]
    - [-21.2, -9.1, 0.30]
    - [-20.9, 14.9, 0.15]
    - [-16.4, 10.5, 0.15]
    - [-8.0, -18.1, 0.15]
    - [-0.3, 15.5, 0.15]
    - [1.4, 8.4, 0.15]
    - [4.5, 4.5, 0.30]
    - [6.7, 8.0, 0.15]
    - [8.9, 2.3, 0.15]
    - [10.3, 7.2, 0.15]
    - [11.7, 9.8, 0.15]
    - [11.7, 14.1, 0.15]
    - [13.4, -13.6, 0.15]
    - [14.7, 13.7, 0.15]
    - [14.8, 8.5, 0.15]
    - [15.2, 3.9, 0.15]
    - [19.4, -7.0, 0.15]

params:
  GRID_RESOLUTION: 0.15
  LOCAL_PLAN_RADIUS: 10
  UNKNOWN_POLICY: optimistic
  UNKNOWN_COST: 1.5
  TARGET_REPLAN_THRESHOLD: 0.6
  PATH_DEVIATION_THRESHOLD: 1.0
  GRID_CELLS: []  # no followers
