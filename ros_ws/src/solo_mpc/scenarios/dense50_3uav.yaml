# Three-UAV variant of dense50_1uav.yaml: same 50 x 50 m map and 60 obstacles
# (50 cm poles, 60 cm boxes). The UAVs start in a row 3 m apart at y = 1, all at
# least 3.6 m from obstacles; the ground robot spawn (2.5, 1.5) is 1.6 m from the
# first two, so both cameras see its tag at takeoff.
# Run: ./scripts/dev mpc --fleet /workspace/config/drone_3uav.yaml \
#        --settings /workspace/config/drone_3uav.yaml \
#        --scenario /workspace/ros_ws/src/solo_mpc/scenarios/dense50_3uav.yaml
description: three UAVs tracking the ground robot on the dense 50 x 50 m map
world_name: mpc_dense50
xlim: [0, 50]
ylim: [0, 50]
viewing_radius: 1.5
tar_max_speed: 0.6      # controller's assumed target speed bound; above the ground robot's 0.5 m/s

starts:                 # [x, y, z] in fleet order: middle UAV first, then left and right
  - [4, 1, 2]
  - [1, 1, 2]
  - [7, 1, 2]

target:
  waypoints:            # fixed target, used only without a ground_robot in drone.yaml
    - [45, 45]

obstacles:
  rects:                # [left, bottom, width, height]: 60 x 60 cm boxes
    - [39.6, 2.3, 0.6, 0.6]
    - [16.1, 2.6, 0.6, 0.6]
    - [46, 2.8, 0.6, 0.6]
    - [20.4, 3.4, 0.6, 0.6]
