    - [14.6, 14.3, 0.6, 0.6]
    - [9.8, 14.6, 0.6, 0.6]
    - [39.6, 15.7, 0.6, 0.6]
    - [2, 16.1, 0.6, 0.6]
    - [28.6, 20.5, 0.6, 0.6]
    - [3.8, 21.4, 0.6, 0.6]
    - [7.9, 22, 0.6, 0.6]
    - [16.1, 22.5, 0.6, 0.6]
    - [33.1, 27.2, 0.6, 0.6]
    - [16.2, 28.1, 0.6, 0.6]
    - [21.1, 33.6, 0.6, 0.6]
