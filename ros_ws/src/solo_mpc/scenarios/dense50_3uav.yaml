    - [29, 34.7, 0.6, 0.6]
    - [3, 34.9, 0.6, 0.6]
    - [22.4, 39.4, 0.6, 0.6]
    - [34.9, 40.1, 0.6, 0.6]
    - [40.6, 40.8, 0.6, 0.6]
    - [2.1, 47.7, 0.6, 0.6]
