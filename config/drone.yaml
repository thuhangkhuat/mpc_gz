# Single 3DR Solo-like UAV: fleet entry, sensors, timing, MPC and ArduPilot
# parameters in one file. Select it as both FLEET_CONFIG and MPC_SETTINGS (.env).
# Restart the simulation after any change; values are snapshotted at launch.
#
# Solo-like motion is set by the MPC limits (VMAX, UMAX, ACCEL_TAU) and Solo
# ANGLE_MAX. The Gazebo airframe is Iris with Iris-tuned PIDs, so its attitude
# acceleration limits stay at the ArduPilot defaults: Solo's lower ATC_ACCEL_*
# values without a Solo PID tune made velocity tracking overshoot and oscillate.

# --- Fleet ---------------------------------------------------------------
schema_version: 1
world_name: solo_1uav   # MPC runs use the scenario world_name
uavs:
  - name: uav1
    instance: 0         # SITL instance: MAVLink TCP 5760, JSON UDP 9002
    sysid: 1
    spawn: [1, 1, 0.195, 0, 0, 90]  # MPC runs take x, y from scenario starts

# --- Flight, sensors, timing, target ---------------------------------------
flight_altitude: 2.0  # every scenario start z must match
obstacle_height: 5.0
target_height: 0.05
camera_width: 640       # downward camera; at 2 m a 0.30 m tag spans ~48 px
camera_height: 480
camera_rate: 15.0
camera_hfov: 1.5707963  # 90 degrees: 4 m wide ground footprint at 2 m
lidar_rate: 10.0
lidar_samples: 360
lidar_noise_stddev: 0.01
control_period: 0.2  # 5 Hz MPC: ample at <= 0.7 m/s and leaves solve time on a Raspberry Pi;
                     # setpoints still stream at publish_rate, interpolated along the plan
diagnostic_capture_cycles: 128  # bounded optimizer replay records per UAV in run directory
controller_execution: parallel  # one persistent worker process per UAV; sequential for comparison
controller_worker_timeout_wall: 1.0
controller_worker_startup_timeout_wall: 30.0
publish_rate: 20.0
state_timeout_sim: 0.5
sensor_timeout_sim: 0.5
target_timeout_sim: 1.5
target_search_timeout_sim: 8.0
planner_failure_timeout_sim: 3.0
arrival_fleet_radius: 6.0
arrival_timeout_sim: 300.0  # fixed target is at its goal from the start; ~62 m diagonal at <= 0.7 m/s with detours
arrival_completes_mission: false  # live editing: keep flying until `mission stop`; true lands on arrival
command_timeout_sim: 0.5  # 2.5 control periods
command_timeout_wall: 3.0
pose_timeout_wall: 3.0
fcu_timeout_sim: 2.5
fcu_timeout_wall: 60.0  # heartbeat follows slow SITL; sim-time expiry remains 2.5 s
target_mode: camera  # AprilTag detections only; ground_truth feeds the exact robot pose instead
ground_robot: ground_robot.yaml  # AprilTag robot target, relative to this file; remove for the scripted marker
yaw_mode: target  # face the target estimate; hold heading within viewing_radius. none: FCU holds yaw
altitude_kp: 1.0
vertical_speed_limit: 0.5
calibration_samples: 10
world_from_local_yaw: 0.0  # Gazebo XYZ->NED and MAVROS NED->ENU cancel in this world
frame_history_tolerance: 0.3
scan_height_tolerance: 1.0   # 3 m rays: keeps tilts up to 19.5 deg (UMAX lean is 5.8); rays reach ground only past 35 deg
marker_min_pixels: 4

# --- ArduPilot SITL parameters -------------------------------------------
sitl_params:  # FCU limits loaded on top of copter.parm and gazebo-iris.parm
  ANGLE_MAX: 2000      # Solo 20 deg
  WPNAV_SPEED: 100     # GUIDED speed cap: 0.3 m/s above VMAX for corrections, bounds overshoot
  WPNAV_ACCEL: 200     # GUIDED accel cap: headroom above UMAX
  PSC_JERK_XY: 5       # ArduPilot default, stated explicitly; ACCEL_TAU accounts for it
  WP_YAW_BEHAVIOR: 0   # hold heading whenever a reference carries no yaw (hold/expiry);
                       # the default faces travel direction and spins at low, noisy speeds
  WPNAV_SPEED_UP: 320
  WPNAV_SPEED_DN: 240
  LOIT_SPEED: 1300
  LOIT_ACC_MAX: 200
# --- MPC, planner and solver ----------------------------------------------
params:
  ROBOT_RADIUS: 0.40   # covers Iris prop tips in Gazebo (0.383 m) and a Solo (0.357 m)
  INFLATE_MARGIN: 0.2  # planner keeps 0.6 m from obstacle surfaces
  UAV_SAFE_DISTANCE: 1.0
  COLLISION_AVOID_DISTANCE: 1.5
  VMAX: 0.7  # realistic cruise; flights run at 0.5-0.7 m/s
  UMAX: 1.0  # 5.8 deg lean; stopping from 0.7 m/s takes about 0.75 m with latency
  ACCEL_TAU: 0.3  # Solo attitude acceleration limits plus FCU jerk shaping lag the command
  SENSING_RADIUS: 3.0  # LiDAR range: ~2x stop + corridor margin (1.3 m); short rays tolerate gust tilt
  LOCAL_SEARCH: jps  # uniform step costs; dijkstra applies UNKNOWN_COST
  CONTINGENCY: true
  SPEED_RECOVERY: true  # measured speed slightly above VMAX (FCU overshoot) would make the first
                        # step infeasible: IPOPT then runs to its CPU limit, cycle after cycle.
                        # Allows only the overspeed a full brake cannot remove; corridor unchanged.
  HORIZON_LENGTH: 8  # 1.6 s prediction at 0.2 s steps (~1.1 m ahead at VMAX)
  BACKUP_HORIZON: 8  # backup ends at rest after 1.6 s; 0.7 m/s needs ~1 s
  W_backup: 0.1
  TERMINAL_STOP: false  # comparison mode; nominal plan may end with nonzero speed
  CORRIDOR_BOX: 1.5
  CORRIDOR_MAX_FACES: 8  # padded faces still cost every IPOPT iteration; grows to 16 if a corridor needs more
  GOAL_CLAMP_MARGIN: 0.6
  SLOT_MIN_RATIO: 0.3
  SLOT_LOOKAHEAD_TIME: 2.0
  IPOPT_OPTIONS:
    ipopt.max_iter: 500
    # Runtime CPU cap; offline parity uses the reference iteration-only options.
    ipopt.max_cpu_time: 0.15  # inside the 0.2 s period with room for mapping and planning
    ipopt.print_level: 0
    ipopt.tol: 0.0001
    ipopt.acceptable_tol: 0.01
    ipopt.acceptable_iter: 5  # stop after 5 acceptable iterates, not 15: real-time MPC needs the answer now
    print_time: 0
